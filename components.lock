pletion downloads `fd`. Measured on this host: the hermetic tier-F and tier-R batteries fetched NEITHER (a print-mode run with a Read/Grep allowlist did not trigger the download), so the cost is CONDITIONAL rather than unconditional — reported rather than asserted, on the opencode ~62 MB precedent. BEHAVIORAL CHARACTERIZATION IS BY EXECUTION, NOT BY DOCS (P3/measurements/2026-08-26-kimi-cli-print-mode-spike.md, $0 against a loopback fake provider). Three findings bind this entry. (1) `--output-format stream-json` carries NO usage or cost field in any frame; the run's own agents/main/wire.jsonl records one `usage.record` per paid call, decomposed the way S02.4(a) wants (inputOther EXCLUDES cache reads), appended live — that is the D7 source. (2) Hooks are FAIL-OPEN by the vendor's own design and static `[permission] deny` rules are INERT in print mode (measured across three pattern/scope shapes), so the ONLY structural brake is the `[tools]` allowlist, which does strip tools PRE-inference (26 offered → 24 with Agent/AgentSwarm disabled). A CompiledWorker carrying GatedTools is therefore REFUSED BY NAME rather than auto-approved. (3) Left at defaults a model-launched background task keeps `kimi -p` alive indefinitely; the lowered config sets print_background_mode = \"exit\" and explicit turn, wall-clock, bash and retry ceilings, and a spawn missing any of them is refused before the process exists. GATE A IS A RECORDED GRAY ZONE, not a clean pass: the Community Guidelines state \"Kimi Code subscriptions are for interactive use only\" and \"Don't use Kimi Code for non-interactive automation\", which is S03.6 class-3 language. The operator ruled PROCEED on 2026-08-26 with the reasoning recorded in P3/measurements/2026-08-24-kimi-lane-gate-audit.md's 2026-08-26 addendum, and the same ruling binds the existing `kimi` lane. Client identity is NEVER altered (KIMI_CODE_IDENTITY_* unset and scrubbed) because the same page forbids spoofing it. The metered-exception list stays EMPTY [G1 P7]; KIMI_CODE_INFINITE_RETRY is never set (S10.5: engine-native retry is never the policy layer)."
