# CI per Spec S01.11 (build + test) and S16.2 (components.lock gate).
# Every action is pinned to a full commit SHA and carries a components.lock
# entry; tools/lockgate enforces both. The release pipeline (on tag: artifact
# + SHA256SUMS + signed tag, S01.11) is a later P3 packet — do not bolt
# release steps onto this workflow.
#
# ONE job, deliberately ordered (P3/CONVENTIONS.md §41): the SPA is built
# BEFORE the Go steps, so `go build`/`go test` run over the real embedded
# assets and the go:embed integration is exercised on every run rather than
# only the honest-absence path.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no module dependencies yet; enable when the first go.sum lands
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact version, like every other pin. 22.23.1 satisfies Vite 8's
          # engines and jsdom 30's; the maintainer's host runs 22.22.1, which
          # is recorded in the toolchain lock entry's notes.
          node-version: 22.23.1
          # The action's OWN cache, keyed on the lockfile — no separate cache
          # action enters the adoption rail (§4).
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ── the SPA tree ───────────────────────────────────────────────────────
      # `npm ci` (never `npm install`): the committed lockfile is the tree.
      # `--ignore-scripts` is the S16.6 registry-supply-chain posture; no
      # package in this tree needs an install script.
      - name: web install
        run: npm ci --ignore-scripts
        working-directory: web
      - name: web typecheck
        run: npm run typecheck
        working-directory: web
      - name: web test
        run: npm run test
        working-directory: web
      - name: web build
        run: npm run build
        working-directory: web

      # ── the Go side, over the assets the step above just produced ──────────
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: lock-gate
        run: go run ./tools/lockgate
